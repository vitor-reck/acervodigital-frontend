  <!-- Shell CSS -->
  <style>
/* Skip artifact shell: fixed styles served beside every artifact.
   Complements basecoat; artifacts override --accent for their own identity. */
:root {
  color-scheme: light dark;
  --accent: #2563eb;
  --accent-contrast: #ffffff;
  --accent-text: color-mix(in srgb, var(--accent) 72%, #000);
  --bg: #f8f9fb;
  --surface: #ffffff;
  --text: #14171f;
  --text-muted: #5b6472;
  --border: rgba(20, 23, 31, 0.10);
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20, 23, 31, 0.08);
  --space: 16px;
}
/* Theme resolution. Without data-theme the viewer's system preference decides,
   as it always did. With it, the artifact's own choice wins in BOTH directions:
   a page that hardcodes one palette must not be handed the opposite set of
   tokens by the machine it happens to be opened on. The dark values appear
   twice because a media query cannot be folded into a selector list.
   The attribute sits inside :where() so these blocks keep the specificity of a
   bare :root, the page's own <style> is linked after this file and must go on
   overriding any token it wants, exactly as it could before. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
    --bg: #101318;
    --surface: #181c23;
    --text: #eef1f6;
    --text-muted: #9aa4b2;
    --border: rgba(238, 241, 246, 0.12);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}
:root:where([data-theme="dark"]) {
  color-scheme: dark;
  --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
  --bg: #101318;
  --surface: #181c23;
  --text: #eef1f6;
  --text-muted: #9aa4b2;
  --border: rgba(238, 241, 246, 0.12);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
:root:where([data-theme="light"]) { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }

.shell-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.shell-section { padding: calc(var(--space) * 2) 0; }
.shell-grid { display: grid; gap: var(--space); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.shell-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--space); }
.shell-footer { padding: 24px 0 40px; color: var(--text-muted); font-size: 13px; }

.shell-hero { padding: calc(var(--space) * 3) 0 calc(var(--space) * 2); }
.shell-hero h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.15; margin: 0 0 10px; text-wrap: balance; }
.shell-hero p { color: var(--text-muted); max-width: 60ch; margin: 0; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: var(--space);
}

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .kpi-value { font-size: 28px; font-weight: 650; line-height: 1.1; }
.kpi .kpi-label { font-size: 13px; color: var(--text-muted); }
.kpi .kpi-delta { font-size: 12.5px; font-weight: 600; }
.kpi .kpi-delta.up { color: #0a8f3c; }
.kpi .kpi-delta.down { color: #cf3131; }

table.shell-table { border-collapse: collapse; width: 100%; font-size: 14px; }
table.shell-table th {
  text-align: left; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600;
}
table.shell-table th, table.shell-table td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--border); }
table.shell-table td.num, table.shell-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.shell-table tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }

.chart-box { width: 100%; min-height: 220px; }
.chart-box svg { width: 100%; height: auto; display: block; }

.muted { color: var(--text-muted); }
.accent { color: var(--accent-text); }
.shell-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent-text);
}

@media (prefers-reduced-motion: no-preference) {
  .shell-fade { animation: shell-fade 400ms ease both; }
  @keyframes shell-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

</style>
  
  <!-- Google Fonts: Inter & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
      --accent-text: #1D4ED8;
      --accent-contrast: #FFFFFF;
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --muted: #F4F4F5;
      --muted-foreground: #71717A;
      --border: #E4E4E7;
      --foreground: #18181B;
      --success: #16A34A;
      --success-soft: #F0FDF4;
      --success-text: #15803D;
      --warning: #D97706;
      --warning-soft: #FFFBEB;
      --warning-text: #B45309;
      --destructive: #DC2626;
      --destructive-soft: #FEF2F2;
      --destructive-text: #B91C1C;
      --radius: 8px;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--foreground);
    }

    .brand-square {
      width: 28px;
      height: 28px;
      background-color: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: var(--foreground);
    }

    .brand-tag {
      font-size: 11px;
      background: var(--muted);
      color: var(--muted-foreground);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    /* BADGES */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-disponivel {
      background-color: var(--success-soft);
      color: var(--success-text);
      border: 1px solid #BBF7D0;
    }

    .badge-emprestado {
      background-color: var(--muted);
      color: var(--muted-foreground);
      border: 1px solid var(--border);
    }

    .badge-reservado {
      background-color: var(--warning-soft);
      color: var(--warning-text);
      border: 1px solid #FDE68A;
    }

    .badge-atrasado {
      background-color: var(--destructive-soft);
      color: var(--destructive-text);
      border: 1px solid #FECACA;
    }

    /* COMMON COMPONENTS */
    .btn-minimal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--foreground);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-minimal:hover {
      background: var(--muted);
    }

    .btn-primary-solid {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .btn-primary-solid:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #FFFFFF;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover {
      background: var(--muted);
      color: var(--foreground);
    }

    .btn-destructive-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--destructive);
    }

    .btn-destructive-ghost:hover {
      background: var(--destructive-soft);
      color: var(--destructive-text);
    }

    .input-minimal {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s;
    }

    .input-minimal:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .input-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-search-wrap svg {
      position: absolute;
      left: 10px;
      color: var(--muted-foreground);
      pointer-events: none;
    }

    .input-search-wrap input {
      padding-left: 32px;
    }

    .screen-fade {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-msg {
      background: #18181B;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Table styles */
    .saas-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }

    .saas-table th {
      text-align: left;
      font-weight: 500;
      color: var(--muted-foreground);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #FAFAFA;
      font-size: 12px;
    }

    .saas-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--foreground);
    }

    .saas-table tr:last-child td {
      border-bottom: none;
    }

    .saas-table tr:hover td {
      background: #FAFAFA;
    }

    .card-flat {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .cover-box {
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-foreground);
      font-weight: 600;
      font-size: 13px;
      user-select: none;
      flex-shrink: 0;
    }

    /* CSS Bar chart */
    .css-bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 120px;
      padding-top: 16px;
      border-bottom: 1px solid var(--border);
    }

    .css-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .css-bar-fill {
      width: 100%;
      max-width: 32px;
      background: var(--accent);
      border-radius: 4px 4px 0 0;
      transition: height 0.4s ease;
    }

    .css-bar-col:hover .css-bar-fill {
      background: var(--accent-hover);
    }

    .css-bar-label {
      font-size: 10px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
    }

    /* ============================================================
       ADAPTAÇÃO AO PROMPT: SPA responsiva (desktop e tablet)
       Os tokens e componentes acima são os mesmos do protótipo.
    ============================================================ */
    :root { --muted-strong: #52525B; --info-border: #BFDBFE; }
    html { scroll-behavior: smooth; }
    body { font-size: 14px; }
    button, input, select, textarea { font-family: inherit; }
    a { color: var(--accent-text); }
    a:not([class]) { text-decoration: underline; text-underline-offset: 2px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .input-minimal:focus-visible { outline: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip-link { position: absolute; left: 8px; top: -48px; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 6px; z-index: 5000; font-size: 13px; text-decoration: none; }
    .skip-link:focus { top: 8px; }
    button:disabled, .btn-minimal:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .muted { color: var(--muted-foreground); }
    .nowrap { white-space: nowrap; }
    .text-right { text-align: right; }

    /* App shell */
    #app { flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .app-shell { display: flex; flex: 1; width: 100%; min-height: 100vh; }
    .app-sidebar { width: 240px; flex-shrink: 0; background: var(--muted); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 60; }
    .sidebar-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 0 4px; text-decoration: none; color: var(--foreground); }
    .sidebar-brand .brand-title { font-weight: 700; font-size: 14px; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: var(--muted-strong); padding: 14px 12px 4px; }
    .sidebar-btn { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--foreground); background: transparent; border: none; cursor: pointer; text-align: left; transition: all 0.15s ease; text-decoration: none; position: relative; width: 100%; }
    .sidebar-btn:hover { background: #E4E4E7; }
    .sidebar-btn.active { background: #FFFFFF; color: var(--accent-text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
    .sidebar-btn .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; background: var(--destructive); color: #fff; padding: 1px 6px; border-radius: 999px; }
    .sidebar-footer { padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; color: var(--foreground); }
    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; }
    .topbar { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: #FFFFFF; position: sticky; top: 0; z-index: 50; }
    .topbar-search { flex: 1; max-width: 440px; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn { position: relative; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; color: var(--muted-strong); transition: all 0.15s ease; }
    .icon-btn:hover { background: var(--muted); color: var(--foreground); }
    .icon-btn.sm { width: 30px; height: 30px; }
    .icon-btn.danger:hover { background: var(--destructive-soft); color: var(--destructive-text); }
    .icon-btn .dot-count { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--destructive); color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }
    .menu-toggle { display: none; }
    .user-chip { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 3px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; font-size: 12px; }
    .user-chip:hover { background: var(--muted); }
    .user-chip .who { line-height: 1.2; text-align: left; }
    .user-chip .who b { display: block; font-weight: 600; font-size: 12px; }
    .user-chip .who span { color: var(--muted-foreground); font-size: 11px; }
    .menu-pop { position: absolute; right: 24px; top: 52px; width: 252px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.18); padding: 6px; z-index: 70; animation: fadeIn 0.15s ease; }
    .menu-pop .menu-head { padding: 8px 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .menu-pop .menu-head b { display: block; font-size: 13px; }
    .menu-pop .menu-head span { font-size: 11.5px; color: var(--muted-foreground); }
    .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 6px; font-size: 13px; cursor: pointer; text-align: left; color: var(--foreground); }
    .menu-item:hover { background: var(--muted); }
    .content { flex: 1; padding: 24px 28px 48px; width: 100%; max-width: 1320px; margin: 0 auto; outline: none; }
    .sidebar-scrim { display: none; }

    /* Cabeçalho de página */
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .page-title { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .page-sub { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 12px; flex-wrap: wrap; }
    .crumbs a { color: var(--muted-foreground); text-decoration: none; }
    .crumbs a:hover { color: var(--accent-text); text-decoration: underline; }
    .section-title { font-size: 14px; font-weight: 700; }
    .eyebrow { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em; }

    /* Grades */
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
    @media (min-width: 1280px) { .grid-kpi.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .grid-books { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-main-side { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }

    /* Cards */
    .kpi-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: block; text-align: left; text-decoration: none; color: inherit; width: 100%; font: inherit; }
    .kpi-card .kpi-label { font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .kpi-card .kpi-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; margin-top: 4px; }
    .kpi-card .kpi-hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
    .kpi-card.danger { border-left: 3px solid var(--destructive); }
    .kpi-card.danger .kpi-value { color: var(--destructive); }
    .kpi-card.warn { border-left: 3px solid var(--warning); }
    .kpi-card.ok { border-left: 3px solid var(--success); }
    button.kpi-card, a.kpi-card { cursor: pointer; transition: all 0.15s ease; }
    button.kpi-card:hover, a.kpi-card:hover { border-color: var(--info-border); background: #FAFCFF; }
    .card-flat.flush { padding: 0; overflow: hidden; }
    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

    .form-field { display: flex; flex-direction: column; gap: 4px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted-foreground); }
    .empty-state .empty-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--muted); color: var(--muted-strong); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(24, 24, 27, 0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; animation: fadeIn 0.15s ease; }

    /* Toast (variantes) */
    .toast-msg.error { background: #7F1D1D; }
    .toast-msg { max-width: 360px; }

    /* Autenticação */
    .auth-wrap { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; }
    .auth-aside { background: var(--muted); border-right: 1px solid var(--border); padding: 48px; display: flex; flex-direction: column; justify-content: center; }

    .demo-box { border: 1px dashed #A1A1AA; border-radius: 8px; padding: 12px; background: #FAFAFA; font-size: 12px; }
    .demo-box button { margin-top: 6px; }

    /* Logs do job */
    .log-box { background: #18181B; color: #E4E4E7; border-radius: 8px; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; overflow-x: auto; }
    .log-box .ok { color: #4ADE80; }
    .log-box .warn { color: #FBBF24; }
    .log-box .err { color: #F87171; }
    .log-box .t { color: #A1A1AA; }
    .step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .step:last-child { border-bottom: none; }
    .step-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-dot.ok { background: var(--success-soft); color: var(--success-text); }
    .step-dot.err { background: var(--destructive-soft); color: var(--destructive-text); }
    .step-dot.skip { background: var(--muted); color: var(--muted-foreground); }

    /* ============ Responsivo ============ */
    @media (max-width: 1280px) {
      .detail-layout { grid-template-columns: 240px minmax(0, 1fr); gap: 24px; }
    }
    /* Tablet: menu lateral recolhido em trilho de ícones */
    @media (min-width: 768px) and (max-width: 1099px) {
      .app-sidebar { width: 68px; padding: 12px 8px; align-items: stretch; }

    }
    @media (max-width: 1099px) {

      .detail-layout { grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
    }
    /* Telas estreitas: menu em gaveta */
    @media (max-width: 767px) {
      .menu-toggle { display: inline-flex; }
      .app-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-100%); transition: transform 0.2s ease; z-index: 1500; box-shadow: none; }
      .app-sidebar.open { transform: none; box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2); }

    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }

  <script>
    'use strict';
    /* =================================================================
       ACERVO DIGITAL: SPA (HTML + CSS + JS puro, sem build)
       Camadas deste arquivo:
         1. Utilitários e ícones
         2. Dados de demonstração e persistência local
         3. Componentes reutilizáveis (toast, modal, alertas, badges...)
         4. Layout (autenticação e shell com menu lateral e topo)
         5. Telas, agrupadas por módulo
         6. Roteador por hash e inicialização
       Para integrar a uma API real, troque as funções do bloco
       "Regras de negócio" por chamadas HTTP; as telas só leem o `db`.
    ================================================================= */

    /* ---------- 1. Utilitários ---------- */
    const HOJE = '2026-10-17';          // data de referência da demonstração
    const MULTA_DIA = 2.00;             // R$ por dia de atraso (FINE_AMOUNT_PER_DAY na API)
    const PRAZO_DIAS = 30;              // prazo de devolução, contado a partir da retirada
    const PAGE_SIZE = 8;

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = (n) => String(n).padStart(2, '0');
    const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

    function fmtDate(iso) { if (!iso) return '-'; const p = iso.slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
    function fmtTime(iso) { return iso && iso.length > 10 ? iso.slice(11, 16) : ''; }
    function fmtDateTime(iso) { return iso ? fmtDate(iso) + (iso.length > 10 ? ' ' + fmtTime(iso) : '') : '-'; }
    function fmtPub(iso) { if (!iso) return '-'; return iso.slice(5) === '01-01' ? iso.slice(0, 4) : fmtDate(iso); }
    function toDate(iso) { const p = iso.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
    function addDays(iso, n) { const d = toDate(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function diffDays(a, b) { return Math.round((toDate(a) - toDate(b)) / 86400000); }
    function nowIso() { const d = new Date(); return HOJE + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function friendly(iso) {
      if (!iso) return '-';
      const d = iso.slice(0, 10);
      if (d === HOJE) return 'Hoje, ' + fmtTime(iso);
      if (d === addDays(HOJE, -1)) return 'Ontem, ' + fmtTime(iso);
      return fmtDateTime(iso);
    }
    function dueText(iso) {
      const n = diffDays(iso, HOJE);
      if (n === 0) return 'vence hoje';
      if (n === 1) return 'vence amanhã';
      if (n > 1) return 'vence em ' + n + ' dias';
      return 'venceu há ' + plural(-n, 'dia', 'dias');
    }
    function money(n) { return 'R$ ' + Number(n).toFixed(2).replace('.', ','); }
    function initials(t) {
      const w = String(t).trim().split(/\s+/);
      return (w.length > 1 ? w[0][0] + w[1][0] : String(t).slice(0, 2)).toUpperCase();
    }
    function nameInitials(n) { const w = String(n).replace(/^Prof\.\s*/, '').trim().split(/\s+/); return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }
    function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
    function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
    function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }

    /* Ícones (estilo Lucide, traço 2) */
    const ICONS = {
      book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      dashboard: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
      library: '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      dollar: '<line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',

    function findLoanByTicket(code) {
      const c = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
      return db.loans.find((l) => l.ticket === c) || null;
    }

    function createReservation(userId, bookId) {
      const b = bookById(bookId);
      if (!b) return { ok: false, error: 'Livro não encontrado.' };
      if (db.loans.some((l) => l.userId === userId && l.bookId === bookId && OPEN.indexOf(l.status) >= 0)) {
        return { ok: false, error: 'Você já possui uma reserva ou locação em aberto deste livro.' };
      }
      if (b.stock < 1) return { ok: false, error: 'Não há exemplares disponíveis no momento.' };
      b.stock -= 1;
      const id = nextId('loan', 'LC-', 4);
      const loan = { id, ticket: ticketFor(db.seq.loan + 1000, HOJE), userId, bookId, bookTitle: b.title, bookAuthor: b.author, status: 'reservada', reservedAt: HOJE };
      db.loans.unshift(loan);
      if (db.wishlist[userId]) db.wishlist[userId] = db.wishlist[userId].filter((w) => w.bookId !== bookId);
      saveDb();
      return { ok: true, loan };
    }

    function cancelReservation(loanId) {
      const l = loanById(loanId);
      if (!l || l.status !== 'reservada') return { ok: false, error: 'Somente reservas ainda não retiradas podem ser canceladas.' };
      l.status = 'cancelada'; l.cancelledAt = HOJE;
      const b = bookById(l.bookId); if (b) b.stock += 1;
      saveDb();
      return { ok: true, loan: l };
    }

    function confirmPickup(l) {
      l.status = 'ativa'; l.withdrawnAt = HOJE; l.dueDate = addDays(HOJE, PRAZO_DIAS);

      saveDb();
      return { ok: true };
    }

    /* A devolução não cria multa: quem cria e atualiza multas é o processamento diário */
    function confirmReturn(l) {
      const late = Math.max(0, diffDays(HOJE, l.dueDate));
      l.status = 'devolvida'; l.returnedAt = HOJE;
      const b = bookById(l.bookId); if (b) b.stock += 1;
      logOp('devolucao', l.id);
      saveDb();
      return { ok: true, late, fine: l.fineId ? fineById(l.fineId) : null };
    }

    function registerFinePayment(fineId) {
      const f = fineById(fineId);
      if (!f || f.status !== 'pendente') return { ok: false };
      f.status = 'quitada'; f.paidAt = HOJE;
      notify(f.userId, 'quitacao', "Sua multa referente a '" + fineTitle(f) + "' (" + money(f.amount) + ') foi quitada.');
      saveDb();
      return { ok: true };
    }

    function deleteBook(id) {
      if (openLoansOf(id) > 0) return { ok: false, error: 'Não é possível remover um livro com locações ou reservas em aberto.' };
      db.books = db.books.filter((b) => b.id !== id);
      Object.keys(db.favorites).forEach((u) => { db.favorites[u] = db.favorites[u].filter((x) => x !== id); });
      Object.keys(db.wishlist).forEach((u) => { db.wishlist[u] = db.wishlist[u].filter((w) => w.bookId !== id); });

      saveDb();
      return { ok: true };
    }

    /* ---------- 6. Roteador por hash ---------- */
    function go(path) { if (location.hash === '#' + path) render(); else location.hash = '#' + path; }
    function parseHash() {
      const raw = (location.hash || '').replace(/^#/, '') || '/';
      const i = raw.indexOf('?');
      const path = (i >= 0 ? raw.slice(0, i) : raw).replace(/\/+$/, '') || '/';
      const query = {};
      if (i >= 0) new URLSearchParams(raw.slice(i + 1)).forEach((v, k) => { query[k] = v; });
      return { path, query };
    }
    function matchRoute(path) {
      const segs = path.split('/').filter(Boolean);
      for (const r of ROUTES) {
        const rs = r.p.split('/').filter(Boolean);
        if (rs.length !== segs.length) continue;
        const params = {}; let ok = true;
        for (let i = 0; i < rs.length; i++) {
          if (rs[i][0] === ':') params[rs[i].slice(1)] = decodeURIComponent(segs[i]);
          else if (rs[i] !== segs[i]) { ok = false; break; }
        }
        if (ok) return { def: r, params };
      }
      return null;
    }
    function viewForbidden() {
      return emptyState('shield', 'Acesso restrito', 'Esta área é exclusiva para ' + (isLib() ? 'leitores' : 'bibliotecários') + '. Use o menu lateral para voltar às suas funções.', linkBtn('Ir para o dashboard', '#/dashboard', { cls: 'btn-primary-solid' }));
    }
    function viewNotFound() {
      return emptyState('search', 'Página não encontrada', 'O endereço informado não existe ou foi movido.', linkBtn('Voltar ao início', '#/dashboard', { cls: 'btn-primary-solid' }));
    }
    function render(keep) {
      if (keep !== true) closeModal();
      const { path, query } = parseHash();
      if (path === '/') { go(me() ? '/dashboard' : '/login'); return; }
      const hit = matchRoute(path);
      const app = $('#app');
      if (!hit) {
        if (!me()) { go('/login'); return; }
        app.innerHTML = appShell(viewNotFound(), path); document.title = 'Página não encontrada | Acervo Digital'; return;
      }
      const def = hit.def;
      if (def.public && me()) { go('/dashboard'); return; }
      if (!def.public && !me()) { ui.next = path === '/login' ? null : '#' + path; go('/login'); return; }
      if (def.role && me().role !== def.role) {
        app.innerHTML = appShell(viewForbidden(), '/dashboard'); document.title = 'Acesso restrito | Acervo Digital'; return;
      }
      const html = def.render(hit.params, query);
      app.innerHTML = def.public ? authLayout(html) : appShell(html, def.nav || path);
      document.title = (typeof def.title === 'function' ? def.title(hit.params) : def.title) + ' | Acervo Digital';
      const main = $('#main');
      if (keep === true) { window.scrollTo(0, ui.keepY || 0); return; }
      window.scrollTo(0, 0);
      if (def.after) def.after(hit.params, query); else if (main) main.focus({ preventScroll: true });
    }
    function softRender() { ui.keepY = window.scrollY; render(true); }
    window.addEventListener('hashchange', () => render());

    function fillDemo(e, p) { $('#email').value = e; $('#password').value = p; clearErrs(['email', 'password']); $('#authMsg').innerHTML = ''; $('#password').focus(); }
    function doLogin(ev) {
      ev.preventDefault();
      clearErrs(['email', 'password']);

    function pwRules() {

    function regCheck(id) {
      const v = (id === 'password' || id === 'confirm') ? val(id, true) : val(id);
      if (id === 'name' && !v) return 'Informe seu nome.';
      if (id === 'email') {
        if (!v) return 'Informe seu e-mail.';
        if (!isEmail(v)) return 'Digite um e-mail válido, como nome@dominio.com.';
        if (db.users.some((u) => u.email.toLowerCase() === v.toLowerCase())) return 'Este e-mail já está cadastrado. Entre com sua senha.';
      }
      if (id === 'password') {
        if (!v) return 'Crie uma senha.';
        if (v.length < 8) return 'A senha deve ter pelo menos 8 caracteres.';
      }
      if (id === 'confirm') { if (!v) return 'Repita a senha.'; if (v !== val('password', true)) return 'As senhas não conferem.'; }
      return '';
    }

      const msg = $('#authMsg');

      const u = { id: 'u' + (++db.seq.user), name: val('name'), email: val('email').toLowerCase(), password: val('password', true), role: 'leitor' };

    function dashboardReader() {
      const u = me(), loans = myLoans();
      const active = loans.filter((l) => l.status === 'ativa' || l.status === 'atrasada');
      const late = loans.filter((l) => l.status === 'atrasada');
      const reserved = loans.filter((l) => l.status === 'reservada');
      const pf = myFines().filter((f) => f.status === 'pendente');
      const total = db.books.reduce((s, b) => s + b.stock, 0);
      const notifs = myNotifs();
      let alerts = '';
      if (late.length || pf.length) {
        const parts = [];
        if (late.length) parts.push(plural(late.length, 'livro atrasado', 'livros atrasados'));
        if (pf.length) parts.push('<b>' + money(sumFines(pf)) + '</b> em multas pendentes');
        alerts = alertBox('error', 'Atenção:', 'você tem ' + parts.join(' e ') + '.', '<a class="btn-minimal btn-sm" href="#/' + (pf.length ? 'multas' : 'locacoes') + '">' + (pf.length ? 'Ver multas' : 'Ver locações') + '</a>');
      } else if (reserved.length) {
        alerts = alertBox('info', 'Lembrete:', 'você tem ' + plural(reserved.length, 'reserva aguardando retirada', 'reservas aguardando retirada') + ' no balcão.', '<a class="btn-minimal btn-sm" href="#/locacoes">Ver locações</a>');
      }
      const due = active.concat(reserved).sort((a, b) => ((a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : -1));

    /* ---------- 5.3 Acervo: catálogo ---------- */
    /* Mesmos filtros e ordenações da API: title, author e genre ignoram maiúsculas e acentos */
    function catalogFiltered() {
      const f = ui.f.catalog;
      const list = db.books.filter((b) => {
        if (f.title && norm(b.title).indexOf(norm(f.title)) < 0) return false;
        if (f.author && norm(b.author).indexOf(norm(f.author)) < 0) return false;
        if (f.genre && norm(b.genre).indexOf(norm(f.genre)) < 0) return false;
        if (f.releaseDate && b.pubDate !== f.releaseDate) return false;
        return true;
      });
      const byTitle = (a, b) => a.title.localeCompare(b.title, 'pt-BR');
      const cmp = {
        title: byTitle,
        rating: (a, b) => (ratingOf(b.id).avg - ratingOf(a.id).avg) || byTitle(a, b),
        recent: (a, b) => (a.pubDate < b.pubDate ? 1 : a.pubDate > b.pubDate ? -1 : byTitle(a, b)),
        stock: (a, b) => (b.stock - a.stock) || byTitle(a, b)
      }[f.sort] || byTitle;
      return list.sort(cmp);
    }
    function favBtn(b) {
      const on = favs().indexOf(b.id) >= 0;
      return '<button type="button" class="icon-btn sm ' + (on ? 'on-fav' : '') + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Remover dos favoritos: ' : 'Favoritar: ') + esc(b.title) + '" title="' + (on ? 'Desfavoritar' : 'Favoritar') + '" onclick="toggleFav(\'' + b.id + '\')">' + ico('heart', 16, on ? 'currentColor' : 'none') + '</button>';
    }
    function wishBtn(b) {
      const on = wishes().some((w) => w.bookId === b.id);
      return '<button type="button" class="icon-btn sm ' + (on ? 'on-wish' : '') + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Remover da lista de desejos: ' : 'Adicionar à lista de desejos: ') + esc(b.title) + '" title="' + (on ? 'Remover da lista de desejos' : 'Adicionar à lista de desejos') + '" onclick="toggleWish(\'' + b.id + '\')">' + ico('bookmark', 16, on ? 'currentColor' : 'none') + '</button>';
    }
    function stockText(b) { return plural(b.stock, 'exemplar disponível', 'exemplares disponíveis'); }

    RESULTS.catalog = function () {
      const f = ui.f.catalog, list = catalogFiltered(), pg = paginate(list, f.page);
      if (!list.length) {
        return emptyState('search', 'Nenhum livro encontrado', 'Não encontramos resultados para essa combinação de busca e filtros. Tente outros termos ou limpe os filtros.', btn('Limpar filtros', 'clearCatalogFilters()', { cls: 'btn-primary-solid' }));
      }
      let body;
      if (f.view === 'grid') {
        body = '<div style="padding:16px"><div class="grid-books">' + pg.items.map((b) => {
          const rt = ratingOf(b.id);
          return '<article class="book-card"><div><div class="row between" style="align-items:flex-start;margin-bottom:10px">' + cover(b, 'md') +
            (isLib() ? '' : '<div class="row" style="gap:2px">' + favBtn(b) + wishBtn(b) + '</div>') + '</div>' +
            '<h3><a href="#/acervo/' + b.id + '" style="color:inherit;text-decoration:none">' + esc(b.title) + '</a></h3><p class="author">' + esc(b.author) + '</p>' +
            '<div class="meta"><span class="tag">' + esc(b.genre) + '</span>' + (rt.n ? '<span class="font-mono" style="font-size:11px;color:var(--warning-text);font-weight:500">★ ' + rt.avg.toFixed(1).replace('.', ',') + '</span>' : '') + '</div>' +
            '<div class="stock-line">' + stockText(b) + '</div></div>' +
            '<div class="foot">' + availBadge(b) + '<div class="row" style="gap:4px">' + (isLib() ? '<a class="icon-btn sm" href="#/acervo/' + b.id + '/editar" aria-label="Editar ' + esc(b.title) + '" title="Editar">' + ico('edit', 15) + '</a>' : '') +
            '<a class="btn-minimal btn-sm" href="#/acervo/' + b.id + '">Ver detalhes</a></div></div></article>';
        }).join('') + '</div></div>';
      } else {
        body = '<div class="table-wrap"><table class="saas-table"><caption class="sr-only">Livros do acervo</caption><thead><tr><th scope="col">Livro</th><th scope="col">Gênero</th><th scope="col">Lançamento</th><th scope="col">Estoque</th><th scope="col">Disponibilidade</th><th scope="col" class="text-right">Ações</th></tr></thead><tbody>' +
          pg.items.map((b) => '<tr><td><div class="cell-book">' + cover(b, 'sm') + '<div><a href="#/acervo/' + b.id + '" style="font-weight:600;color:inherit;text-decoration:none">' + esc(b.title) + '</a><div class="cell-sub">' + esc(b.author) + '</div></div></div></td>' +
            '<td>' + esc(b.genre) + '</td><td class="font-mono">' + fmtPub(b.pubDate) + '</td><td class="font-mono">' + stockText(b) + '</td><td>' + availBadge(b) + '</td>' +
            '<td class="act"><a class="icon-btn sm" href="#/acervo/' + b.id + '" aria-label="Ver detalhes de ' + esc(b.title) + '" title="Ver detalhes">' + ico('eye', 15) + '</a>' +
            (isLib() ? '<a class="icon-btn sm" href="#/acervo/' + b.id + '/editar" aria-label="Editar ' + esc(b.title) + '" title="Editar">' + ico('edit', 15) + '</a>' : favBtn(b) + wishBtn(b)) + '</td></tr>').join('') + '</tbody></table></div>';
      }
      return body + pagerHtml('catalog', pg);
    };
    function clearCatalogFilters() { ui.f.catalog = Object.assign(ui.f.catalog, { title: '', author: '', genre: '', releaseDate: '', sort: 'title', page: 1 }); render(); }

    function viewCatalog(p, query) {

        '<section class="card-flat flush" aria-label="Catálogo"><form class="filter-bar" role="search" onsubmit="return false">' +
        '<div class="form-field search"><label for="cat-title">Título</label><div class="input-search-wrap">' + ico('search', 14) + '<input id="cat-title" class="input-minimal" type="search" placeholder="Buscar pelo título" value="' + esc(f.title) + '" oninput="catText(\'title\', this.value)" autocomplete="off"></div></div>' +
        '<div class="form-field"><label for="cat-author">Autor</label><input id="cat-author" class="input-minimal" type="search" placeholder="Nome do autor" value="' + esc(f.author) + '" oninput="catText(\'author\', this.value)" autocomplete="off"></div>' +
        fieldHtml({ id: 'cat-genre', label: 'Gênero', tag: 'select', value: f.genre, placeholder: 'Todos', options: genres, attrs: 'onchange="setF(\'catalog\',\'genre\',this.value)"' }) +
        fieldHtml({ id: 'cat-date', label: 'Data de lançamento', type: 'date', value: f.releaseDate, attrs: 'onchange="setF(\'catalog\',\'releaseDate\',this.value)"' }) +
        fieldHtml({ id: 'cat-sort', label: 'Ordenar por', tag: 'select', value: f.sort, options: [['title', 'Título (A a Z)'], ['rating', 'Melhor avaliados'], ['recent', 'Lançamento mais recente'], ['stock', 'Mais exemplares disponíveis']], attrs: 'onchange="setF(\'catalog\',\'sort\',this.value)"' }) +
        '<div class="form-field"><span class="lbl">Visualização</span><div class="segmented" role="group" aria-label="Modo de visualização"><button type="button" class="' + (f.view === 'grid' ? 'active' : '') + '" aria-pressed="' + (f.view === 'grid') + '" onclick="setF(\'catalog\',\'view\',\'grid\');syncSeg(this)">' + ico('grid', 14) + 'Grade</button><button type="button" class="' + (f.view === 'list' ? 'active' : '') + '" aria-pressed="' + (f.view === 'list') + '" onclick="setF(\'catalog\',\'view\',\'list\');syncSeg(this)">' + ico('list', 14) + 'Lista</button></div></div>' +
        '<button type="button" class="btn-minimal btn-ghost" onclick="clearCatalogFilters()">Limpar</button></form>' +
        '<div id="res-catalog" aria-live="polite">' + RESULTS.catalog() + '</div></section>';
    }
    const catText = debounce((key, v) => { setF('catalog', key, v); const n = catalogFiltered().length; const sub = $('.page-sub .font-mono'); if (sub) sub.textContent = plural(n, 'título', 'títulos'); }, 120);

    /* ---------- Favoritos e desejos (ações compartilhadas) ---------- */
    function toggleFav(id) {
      const l = favs(), i = l.indexOf(id), b = bookById(id);
      if (i >= 0) { l.splice(i, 1); toast('Removido dos favoritos'); } else { l.push(id); toast('"' + b.title + '" adicionado aos favoritos'); }
      saveDb(); softRender();
    }
    function toggleWish(id) {
      const l = wishes(), i = l.findIndex((w) => w.bookId === id);
      if (i >= 0) { l.splice(i, 1); saveDb(); toast('Removido da lista de desejos'); softRender(); } else wishModal(id, false);
    }
    function wishModal(id, isEdit) {
      const b = bookById(id), cur = wishes().find((w) => w.bookId === id) || { priority: 'Média', note: '' };
      openModal({
        title: isEdit ? 'Editar item da lista de desejos' : 'Adicionar à lista de desejos',
        body: '<div class="row" style="margin-bottom:14px">' + cover(b, 'sm') + '<div><b>' + esc(b.title) + '</b><div class="muted">' + esc(b.author) + '</div></div></div><div class="stack">' +
          fieldHtml({ id: 'w-priority', label: 'Prioridade', tag: 'select', value: cur.priority, options: PRIORIDADES, required: true }) +
          fieldHtml({ id: 'w-note', label: 'Observação', tag: 'textarea', value: cur.note, placeholder: 'Ex.: indicação de um professor', hint: 'Opcional, até 140 caracteres.', attrs: 'maxlength="140"' }) + '</div>',
        actions: '<button type="button" class="btn-minimal" onclick="closeModal()">Cancelar</button><button type="button" class="btn-minimal btn-primary-solid" onclick="saveWish(\'' + id + '\')">' + (isEdit ? 'Salvar alterações' : 'Adicionar') + '</button>'
      });
      $('#w-priority').focus();
    }
    function saveWish(id) {
      const priority = val('w-priority'), note = val('w-note'), l = wishes(), cur = l.find((w) => w.bookId === id);
      if (cur) { cur.priority = priority; cur.note = note; toast('Item atualizado'); } else { l.push({ bookId: id, priority, note }); toast('Adicionado à lista de desejos'); }
      saveDb(); closeModal(); softRender();
    }

    /* ---------- 5.3 Acervo: detalhe do livro ---------- */

      const u = userById(r.userId);
      return '<article class="review"><div class="row between" style="align-items:flex-start;gap:12px"><div class="row" style="align-items:flex-start;gap:10px"><div class="user-avatar" aria-hidden="true">' + esc(nameInitials(u ? u.name : '?')) + '</div><div>' +
        '<div style="font-weight:600;font-size:13px">' + esc(u ? u.name : 'Usuário removido') + (mine ? ' <span class="status-badge badge-info">Sua avaliação</span>' : '') + '</div>' +
        '<div class="row wrap" style="gap:8px;margin-top:2px">' + stars(r.rating) + '<span class="tag">Exemplar: ' + esc(r.condition) + '</span><span class="muted font-mono" style="font-size:11px">' + fmtDate(r.date) + '</span></div></div></div>' +
        (mine ? '<div class="row" style="gap:2px"><a class="icon-btn sm" href="#/acervo/' + r.bookId + '/avaliar" aria-label="Editar minha avaliação" title="Editar">' + ico('edit', 15) + '</a><button type="button" class="icon-btn sm danger" aria-label="Excluir minha avaliação" title="Excluir" onclick="askDeleteReview(\'' + r.id + '\')">' + ico('trash', 15) + '</button></div>' : '') + '</div>' +
        (r.comment ? '<p style="margin:8px 0 0 42px;font-size:13px;color:var(--muted-strong)">' + esc(r.comment) + '</p>' : '') + '</article>';
    }
    function ratingSummary(bookId) {
      const rs = db.reviews.filter((r) => r.bookId === bookId), rt = ratingOf(bookId);
      let bars = '';
      for (let s = 5; s >= 1; s--) {
        const c = rs.filter((r) => r.rating === s).length, pct = rs.length ? Math.round(c / rs.length * 100) : 0;
        bars += '<div class="dist-row"><span>' + s + ' ★</span><div class="meter" aria-hidden="true"><span style="width:' + pct + '%;background:var(--warning)"></span></div><span class="font-mono">' + c + '</span></div>';
      }
      return '<div style="min-width:180px"><div class="font-mono" style="font-size:32px;font-weight:700;line-height:1">' + (rt.n ? rt.avg.toFixed(1).replace('.', ',') : '0,0') + '</div>' + stars(rt.avg, 16) +
        '<div class="muted" style="font-size:12px;margin:4px 0 10px">' + plural(rt.n, 'avaliação', 'avaliações') + '</div><div class="stack" style="gap:4px">' + bars + '</div></div>';
    }

    function viewBookDetail(p) {
      const b = bookById(p.id);
      if (!b) return emptyState('search', 'Livro não encontrado', 'O livro solicitado não existe mais no acervo.', linkBtn('Voltar ao catálogo', '#/acervo', { cls: 'btn-primary-solid' }));
      const lib = isLib(), can = bookAvail(b);
      const mineOpen = lib ? null : db.loans.find((l) => l.userId === sessionUserId && l.bookId === b.id && OPEN.indexOf(l.status) >= 0);
      const mineRev = lib ? null : db.reviews.find((r) => r.bookId === b.id && r.userId === sessionUserId);
      const reviewable = !lib && (mineRev || canReview(b.id));
      const isFav = !lib && favs().indexOf(b.id) >= 0, isWish = !lib && wishes().some((w) => w.bookId === b.id);
      const reviews = db.reviews.filter((r) => r.bookId === b.id).sort((x, y) => (x.date < y.date ? 1 : -1));
      const rt = ratingOf(b.id);
      let notices = '';
      if (mineOpen) notices += alertBox('info', 'Você já tem este livro.', 'Situação: ' + loanBadge(mineOpen.status) + ' · ticket <span class="font-mono">' + mineOpen.ticket + '</span>.', '<a class="btn-minimal btn-sm" href="#/locacoes">Ver locação</a>');
      let actions;
      if (lib) {
        actions = linkBtn('Editar livro', '#/acervo/' + b.id + '/editar', { cls: 'btn-primary-solid btn-lg', icon: 'edit' }) +

    function onCoverPick(input) {

    function removeCover() { ui.coverDraft = null; const i = $('#bk-cover'); if (i) i.value = ''; refreshCoverPreview(); }

      else if (s < 0) e['bk-stock'] = 'O estoque não pode ser negativo.';

    function saveBook(ev) {

      const l = findLoanByTicket(code);

      const b = loanBook(l), u = userById(l.userId);

          '<div class="card-flat">' + emptyState('heart', 'Nenhum favorito por enquanto', 'Toque no coração em qualquer livro do catálogo para guardá-lo aqui e encontrá-lo depois.', linkBtn('Explorar catálogo', '#/acervo', { cls: 'btn-primary-solid', icon: 'search' })) + '</div>');

          items.map((w) => { const b = bookById(w.bookId); return '<tr><td><div class="cell-book">' + cover(b, 'sm') + '<div><a href="#/acervo/' + b.id + '" style="font-weight:600;color:inherit;text-decoration:none">' + esc(b.title) + '</a><div class="cell-sub">' + esc(b.author) + '</div></div></div></td><td>' + priorityBadge(w.priority) + '</td>' +

          '<div class="card-flat">' + emptyState('bookmark', 'Sua lista de desejos está vazia', 'Guarde aqui os livros que você quer ler no futuro e defina uma prioridade para cada um.', linkBtn('Explorar catálogo', '#/acervo', { cls: 'btn-primary-solid', icon: 'search' })) + '</div>');

    function askRemoveWish(id) {

        title: 'Remover da lista de desejos', icon: 'trash', danger: true, confirmLabel: 'Remover',

    /* ---------- 5.9 Notificações ---------- */
    function notifsFiltered() {
      const t = ui.f.notifs.type;
      return myNotifs().filter((n) => (t === 'unread' ? !n.read : t ? n.type === t : true));
    }
    RESULTS.notifs = function () {
      const list = notifsFiltered(), pg = paginate(list, ui.f.notifs.page);

        const t = ui.f.notifs.type;
        return emptyState('bell', t === 'unread' ? 'Tudo em dia!' : 'Nenhuma notificação', t === 'unread' ? 'Você não tem notificações não lidas.' : 'Avisos de vencimento e de multas aparecem aqui.', t ? btn('Ver todas', "setF('notifs','type','');render()", { cls: 'btn-primary-solid' }) : '');
      }
      return pg.items.map((n) => { const t = NOTIF_TYPES[n.type]; return '<article class="notif ' + (n.read ? '' : 'unread') + '"><div class="notif-icon ' + t[3] + '">' + ico(t[2], 17) + '</div><div class="grow"><div class="notif-title">' + esc(t[1]) + '</div>' +
        '<div class="notif-text">' + esc(n.text) + '</div><div class="row wrap" style="gap:8px;margin-top:6px"><span class="notif-time" style="margin-top:0">' + friendly(n.at) + '</span></div></div>' +
        '<div class="row" style="gap:2px">' + (n.read ? '' : '<button type="button" class="icon-btn sm" aria-label="Marcar como lida: ' + esc(t[1]) + '" title="Marcar como lida" onclick="markRead(\'' + n.id + '\')">' + ico('check', 16) + '</button>') +
        '<button type="button" class="icon-btn sm danger" aria-label="Remover: ' + esc(t[1]) + '" title="Remover" onclick="removeNotif(\'' + n.id + '\')">' + ico('trash', 16) + '</button></div></article>'; }).join('') + pagerHtml('notifs', pg);
    };
    function viewNotifications() {
      const all = myNotifs(), un = all.filter((n) => !n.read).length, cnt = (t) => all.filter((n) => n.type === t).length, f = ui.f.notifs;
      return pageHead('Central de notificações', un ? plural(un, 'notificação não lida', 'notificações não lidas') : 'Você está em dia com seus avisos',
        '<button type="button" class="btn-minimal" onclick="markAllRead()"' + (un ? '' : ' disabled') + '>' + ico('check', 14) + 'Marcar todas como lidas</button><button type="button" class="btn-minimal btn-ghost" onclick="askClearRead()"' + (all.length - un ? '' : ' disabled') + '>' + ico('trash', 14) + 'Limpar lidas</button>') +
        '<section class="card-flat flush"><div class="filter-bar">' + segmented('notifs', 'type', [['', 'Todas', all.length], ['unread', 'Não lidas', un], ['prazo', 'Vencimento', cnt('prazo')], ['multa', 'Multa gerada', cnt('multa')], ['quitacao', 'Multa quitada', cnt('quitacao')]], f.type) + '</div>' +
        '<div id="res-notifs" aria-live="polite">' + RESULTS.notifs() + '</div></section>';
    }

    function markRead(id) { const n = db.notifications.find((x) => x.id === id); if (n) n.read = true; saveDb(); softRender(); }
    function markAllRead() { db.notifications.forEach((n) => { if (n.userId === sessionUserId) n.read = true; }); saveDb(); toast('Todas as notificações foram marcadas como lidas'); softRender(); }
    function removeNotif(id) { db.notifications = db.notifications.filter((x) => x.id !== id); saveDb(); toast('Notificação removida'); softRender(); }
    function askClearRead() {
      const n = myNotifs().filter((x) => x.read).length;
      confirmModal({
        title: 'Limpar notificações lidas', icon: 'trash', danger: true, confirmLabel: 'Limpar',
        html: '<p>Remover ' + plural(n, 'notificação lida', 'notificações lidas') + '? As não lidas serão mantidas.</p>',
        onConfirm: () => { db.notifications = db.notifications.filter((x) => !(x.userId === sessionUserId && x.read)); saveDb(); toast('Notificações lidas removidas'); softRender(); }
      });
    }

    /* ---------- 5.10 Administração: logs do job diário (GET /jobs) ---------- */
    function runSeconds(r) { return Math.max(0, Math.round((new Date(r.finishedAt + 'Z') - new Date(r.startedAt + 'Z')) / 1000)); }
    function runSummary(r) {
      const s = r.details.summary;
      return plural(r.details.rentalsScanned, 'locação verificada', 'locações verificadas') + ' · ' + plural(s.overdueMarked, 'atraso marcado', 'atrasos marcados') + ' · ' + plural(s.finesCreated, 'multa criada', 'multas criadas') + ' · ' + plural(s.notificationsSent, 'notificação', 'notificações');
    }
    function runsFiltered() {
      const st = ui.f.logs.status;
      return db.jobRuns.filter((r) => !st || r.status === st).sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1));
    }
    RESULTS.logs = function () {
      const list = runsFiltered(), pg = paginate(list, ui.f.logs.page);
      if (!list.length) return emptyState('terminal', 'Nenhuma execução encontrada', 'Não há execuções para o filtro selecionado.', btn('Ver todas', "setF('logs','status','');render()", { cls: 'btn-primary-solid' }));
      return '<div class="table-wrap"><table class="saas-table"><caption class="sr-only">Execuções do job diário</caption><thead><tr><th scope="col">Execução</th><th scope="col">Início</th><th scope="col">Duração</th><th scope="col">Status</th><th scope="col">Resumo do processamento</th><th scope="col" class="text-right">Ações</th></tr></thead><tbody>' +
        pg.items.map((r) => '<tr class="' + (r.status === 'failed' ? 'row-danger' : '') + '"><td class="font-mono" style="font-weight:600">' + r.id + '</td><td class="font-mono nowrap">' + fmtDateTime(r.startedAt) + '</td><td class="font-mono">' + runSeconds(r) + 's</td><td>' + jobBadge(r.status) + '</td>' +
          '<td style="max-width:360px">' + (r.status === 'failed' ? '<span style="color:var(--destructive-text)">' + esc(r.error) + '</span>' : esc(runSummary(r))) + '</td>' +
          '<td class="act"><a class="btn-minimal btn-ghost btn-sm" href="#/admin/logs/' + r.id + '">Ver detalhes</a></td></tr>').join('') + '</tbody></table></div>' + pagerHtml('logs', pg);
    };
    function viewLogs() {
      const runs = db.jobRuns, r = lastRun(), ok = runs.filter((x) => x.status === 'success').length, f = ui.f.logs;
      return pageHead('Logs do job diário', 'Execuções do processamento de vencimentos, atrasos, multas e avisos (todos os dias às 03:00, horário de Brasília)') +
        (r.status === 'failed' ? '<div style="margin-bottom:16px">' + alertBox('error', 'A última execução falhou.', esc(r.error || ''), '<a class="btn-minimal btn-sm" href="#/admin/logs/' + r.id + '">Ver detalhes</a>') + '</div>' : '') +
        '<div class="grid-kpi">' + kpi('Última execução', '<span style="font-size:18px;color:var(' + (r.status === 'success' ? '--success-text' : '--destructive') + ')">' + (r.status === 'success' ? 'Sucesso' : 'Falha') + '</span>', fmtDateTime(r.startedAt), { cls: r.status === 'success' ? 'ok' : 'danger', icon: 'activity' }) +
        kpi('Taxa de sucesso', Math.round(ok / runs.length * 100) + '%', ok + ' de ' + runs.length + ' execuções', { icon: 'checkCircle' }) +
        kpi('Falhas registradas', runs.length - ok, 'no histórico recente', { cls: runs.length - ok ? 'warn' : '', icon: 'alertTriangle' }) +
        kpi('Próxima execução', '<span style="font-size:18px">18/10 03:00</span>', 'agendada automaticamente', { icon: 'clock' }) + '</div>' +
        '<section class="card-flat flush"><div class="filter-bar"><div class="form-field"><span class="lbl">Status</span>' + segmented('logs', 'status', [['', 'Todas', runs.length], ['success', 'Sucesso', ok], ['failed', 'Falha', runs.length - ok]], f.status) + '</div></div>' +
        '<div id="res-logs" aria-live="polite">' + RESULTS.logs() + '</div></section>';
    }
    function viewLogDetail(p) {
      const r = runById(p.id);
      if (!r) return emptyState('terminal', 'Execução não encontrada', 'O registro solicitado não existe.', linkBtn('Voltar aos logs', '#/admin/logs', { cls: 'btn-primary-solid' }));
      const d = r.details, s = d.summary, fail = r.status === 'failed';
      const eventLabel = { due_today: 'Vence hoje', overdue: 'Em atraso' };
      const rows = d.rentals.length ? '<div class="table-wrap"><table class="saas-table"><caption class="sr-only">Locações tratadas</caption><thead><tr><th scope="col">Ticket</th><th scope="col">Leitor</th><th scope="col">Evento</th><th scope="col">Atraso</th><th scope="col">Multa</th><th scope="col">Notificação</th></tr></thead><tbody>' +
        d.rentals.map((x) => '<tr><td class="font-mono">' + esc(x.ticketCode) + '</td><td>' + esc((userById(x.userId) || { name: '-' }).name) + '</td><td>' + esc(eventLabel[x.event] || x.event) + '</td><td class="font-mono">' + (x.daysLate ? plural(x.daysLate, 'dia', 'dias') : '-') + (x.markedOverdue ? ' <span class="status-badge badge-atrasado">marcada hoje</span>' : '') + '</td><td class="font-mono">' + (x.fineAmount ? money(Number(x.fineAmount)) + (x.fineCreated ? ' <span class="status-badge badge-info">criada</span>' : '') : '-') + '</td><td>' + (x.notificationSent ? 'Enviada' : 'Já enviada hoje') + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div style="padding:16px">' + emptyState('inbox', 'Sem detalhamento por locação', fail ? 'A execução falhou antes de registrar as locações tratadas.' : 'Nenhuma locação venceu ou estava em atraso nesta execução.') + '</div>';
      return crumbs([['Logs do job diário', '#/admin/logs'], [r.id]]) +
        pageHead(r.id, 'Iniciada em ' + fmtDateTime(r.startedAt) + ' · duração de ' + runSeconds(r) + 's · data de referência ' + fmtDate(d.referenceDate), '<a class="btn-minimal" href="#/admin/logs">' + ico('arrowL', 14) + 'Voltar</a>') +
        '<div style="margin-bottom:16px">' + (fail ? alertBox('error', 'Execução com falha.', esc(r.error || '') + ' O progresso feito até a falha ficou registrado.') : alertBox('success', 'Execução concluída com sucesso.', esc(runSummary(r)) + '.')) + '</div>' +
        '<div class="grid-kpi">' + kpi('Locações verificadas', d.rentalsScanned, 'ativas ou atrasadas') + kpi('Atrasos marcados', s.overdueMarked, 'passaram a atrasadas', { cls: s.overdueMarked ? 'warn' : '' }) +
        kpi('Multas criadas', s.finesCreated, money(MULTA_DIA) + ' por dia de atraso') + kpi('Notificações enviadas', s.notificationsSent, 'vencimento e multa') + '</div>' +
        '<section class="card-flat flush" aria-labelledby="h-rt" style="margin-bottom:20px"><div class="card-head"><h2 class="section-title" id="h-rt">Locações tratadas</h2></div>' + rows + '</section>' +
        '<div class="grid-2"><section class="card-flat" aria-labelledby="h-rq"><h2 class="section-title" id="h-rq" style="margin-bottom:10px">Requisição e resposta</h2><dl class="kv"><dt>Requisição</dt><dd class="font-mono">' + esc(r.request.method + ' ' + r.request.path) + '</dd><dt>Status HTTP</dt><dd class="font-mono">' + r.response.statusCode + '</dd><dt>Início</dt><dd class="font-mono">' + fmtDateTime(r.startedAt) + '</dd><dt>Fim</dt><dd class="font-mono">' + fmtDateTime(r.finishedAt) + '</dd></dl></section>' +
        '<section class="card-flat" aria-labelledby="h-lg"><h2 class="section-title" id="h-lg" style="margin-bottom:10px">' + (fail ? 'Erro registrado' : 'Resposta do processamento') + '</h2><div class="log-box" tabindex="0" role="log" aria-label="Saída do processamento">' +
        (fail ? '<div class="err">' + esc(r.traceback || r.error).replace(/\n/g, '<br>') + '</div>' : '<div class="ok">' + esc(JSON.stringify(r.response.body)) + '</div>') + '</div></section></div>';
    }

    /* ---------- 5.10 Leitores (bibliotecário): GET /users?q= e histórico do RF-108 ---------- */
    function readersFiltered() {
      const q = norm(ui.f.readers.q);
      return db.users.filter((u) => u.role === 'leitor' && (!q || norm(u.name).indexOf(q) >= 0 || norm(u.email).indexOf(q) >= 0)).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    }
    RESULTS.readers = function () {
      const list = readersFiltered(), pg = paginate(list, ui.f.readers.page);
      if (!list.length) return emptyState('users', 'Nenhum leitor encontrado', 'Tente buscar por outra parte do nome ou do e-mail.');
      return '<div class="table-wrap"><table class="saas-table"><caption class="sr-only">Leitores</caption><thead><tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Em aberto</th><th scope="col">Multas pendentes</th><th scope="col" class="text-right">Ações</th></tr></thead><tbody>' +
        pg.items.map((u) => { const open = db.loans.filter((l) => l.userId === u.id && OPEN.indexOf(l.status) >= 0).length, pf = pendingFines(db.fines.filter((f) => f.userId === u.id));
          return '<tr><td><div class="row"><div class="user-avatar" aria-hidden="true">' + esc(nameInitials(u.name)) + '</div><b>' + esc(u.name) + '</b></div></td><td>' + esc(u.email) + '</td><td class="font-mono">' + open + '</td><td class="font-mono"' + (pf.length ? ' style="color:var(--destructive);font-weight:600"' : '') + '>' + (pf.length ? money(sumFines(pf)) : '-') + '</td><td class="act"><a class="btn-minimal btn-sm" href="#/leitores/' + u.id + '">Ver histórico</a></td></tr>'; }).join('') + '</tbody></table></div>' + pagerHtml('readers', pg);
    };
    function viewReaders() {
      return pageHead('Leitores', 'Busque um leitor por nome ou e-mail para consultar o histórico de locações e as multas pendentes') +
        '<section class="card-flat flush"><div class="filter-bar"><div class="form-field search"><label for="rd-q">Buscar leitor</label><div class="input-search-wrap">' + ico('search', 14) + '<input id="rd-q" class="input-minimal" type="search" placeholder="Nome ou e-mail" value="' + esc(ui.f.readers.q) + '" oninput="setF(\'readers\',\'q\',this.value)" autocomplete="off"></div></div></div>' +
        '<div id="res-readers" aria-live="polite">' + RESULTS.readers() + '</div></section>';
    }
    function viewReaderDetail(p) {
      const u = userById(p.id);
      if (!u || u.role !== 'leitor') return emptyState('users', 'Leitor não encontrado', 'O leitor solicitado não existe.', linkBtn('Voltar aos leitores', '#/leitores', { cls: 'btn-primary-solid' }));
      const loans = db.loans.filter((l) => l.userId === u.id).sort((a, b) => ((a.reservedAt + a.id) < (b.reservedAt + b.id) ? 1 : -1));
      const pf = pendingFines(db.fines.filter((f) => f.userId === u.id));
      const open = loans.filter((l) => OPEN.indexOf(l.status) >= 0);
      const loanRows = loans.length ? '<div class="table-wrap"><table class="saas-table"><caption class="sr-only">Histórico de locações</caption><thead><tr><th scope="col">Livro</th><th scope="col">Ticket</th><th scope="col">Status</th><th scope="col">Datas importantes</th><th scope="col" class="text-right">Ações</th></tr></thead><tbody>' +
        loans.map((l) => { const b = loanBook(l); return '<tr class="' + (l.status === 'atrasada' ? 'row-danger' : '') + '"><td><div class="cell-book">' + cover(b, 'sm') + '<div><div style="font-weight:600">' + esc(b.title) + '</div><div class="cell-sub">' + esc(b.author) + '</div></div></div></td><td class="font-mono">' + l.ticket + '</td><td>' + loanBadge(l.status) + '</td><td>' + loanDates(l) + '</td><td class="act">' + loanActions(l, true) + '</td></tr>'; }).join('') + '</tbody></table></div>'
        : emptyState('clock', 'Sem locações', 'Este leitor ainda não fez reservas.');
      const fineRows = pf.length ? pf.map((f) => '<div class="notif"><div class="notif-icon multa">' + ico('dollar', 16) + '</div><div class="grow"><div class="notif-title">' + money(f.amount) + ' · ' + esc(fineTitle(f)) + '</div><div class="notif-text">' + plural(f.days, 'dia', 'dias') + ' de atraso · gerada em ' + fmtDate(f.createdAt) + '</div></div><button type="button" class="btn-minimal btn-sm" onclick="askPayFine(\'' + f.id + '\')">Registrar quitação</button></div>').join('')
        : emptyState('checkCircle', 'Sem multas pendentes', 'Este leitor não tem multas em aberto.');
      return crumbs([['Leitores', '#/leitores'], [u.name]]) +
        pageHead(u.name, esc(u.email)) +
        '<div class="grid-kpi">' + kpi('Locações e reservas', loans.length, 'no histórico') + kpi('Em aberto', open.length, plural(open.filter((l) => l.status === 'atrasada').length, 'atrasada', 'atrasadas'), { cls: open.some((l) => l.status === 'atrasada') ? 'warn' : '' }) +
        kpi('Multas pendentes', money(sumFines(pf)), plural(pf.length, 'multa', 'multas'), { cls: pf.length ? 'danger' : 'ok' }) + '</div>' +
        '<div class="grid-main-side"><section class="card-flat flush" aria-labelledby="h-hist"><div class="card-head"><h2 class="section-title" id="h-hist">Histórico de locações e reservas</h2></div>' + loanRows + '</section>' +
        '<section class="card-flat flush" aria-labelledby="h-mul"><div class="card-head"><h2 class="section-title" id="h-mul">Multas pendentes</h2></div>' + fineRows + '</section></div>';
    }

      { p: '/admin/logs', role: 'bibliotecario', title: 'Logs do job diário', render: viewLogs },
      { p: '/admin/logs/:id', role: 'bibliotecario', title: 'Execução do job', render: viewLogDetail, nav: '/admin/logs' }
    ];

    function init() {
      db = loadDb();
      sessionUserId = loadSession();
      if (sessionUserId && !userById(sessionUserId)) sessionUserId = null;
      if (!location.hash || location.hash === '#') location.hash = sessionUserId ? '#/dashboard' : '#/login';
      render();
    }
    init();
  </script>
</body>
</html>
